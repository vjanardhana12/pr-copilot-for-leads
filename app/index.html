<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1e3f" />
  <title>PR Copilot for Leads</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PR Copilot" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- App shell: three views toggled by JS -->
  <div id="app">
    <!-- Top bar -->
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">‹</button>
      <div class="topbar-title" id="topbarTitle">My Pull Requests</div>
      <button id="refreshBtn" class="icon-btn" aria-label="Refresh">⟳</button>
    </header>

    <!-- INBOX VIEW -->
    <main id="inboxView" class="view">
      <div class="selectors">
        <select id="projectSelect" class="selector" aria-label="Project"></select>
        <select id="repoSelect" class="selector" aria-label="Repository"></select>
        <button id="defaultBtn" class="star-btn" title="Set current project/repo as default" aria-label="Set as default">☆</button>
      </div>
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="today">Today</button>
        <button class="tab" data-tab="active">Active</button>
        <button class="tab" data-tab="completed">Completed</button>
        <button class="tab" data-tab="all">All</button>
      </div>
      <div class="subtitle" id="inboxSubtitle">Loading…</div>
      <ul id="prList" class="pr-list"></ul>
    </main>

    <!-- DETAIL VIEW -->
    <main id="detailView" class="view hidden">
      <div id="detailContent"></div>
    </main>

    <!-- DIFF VIEW -->
    <main id="diffView" class="view hidden">
      <div id="diffContent"></div>
    </main>

    <!-- Bottom nav -->
    <nav class="bottomnav">
      <button data-nav="inbox" class="nav-btn active">Inbox</button>
      <button data-nav="diff" class="nav-btn">Diff</button>
      <button data-nav="actions" class="nav-btn">Actions</button>
    </nav>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
