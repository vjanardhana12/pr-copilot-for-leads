<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1e3f"/><stop offset="0.55" stop-color="#123a6b"/><stop offset="1" stop-color="#1e5aa8"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f9ff"/><stop offset="1" stop-color="#e9f0fb"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0b1e3f" flood-opacity="0.14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="160" y="200" fill="#8fd3ff" font-size="34" font-weight="600" letter-spacing="3">AI-DRAFTED FEEDBACK</text>
  <text x="160" y="320" fill="#ffffff" font-size="66" font-weight="700">Precise feedback for</text>
  <text x="160" y="400" fill="#ffffff" font-size="66" font-weight="700">the developer — one tap.</text>
  <g transform="translate(160,490)" font-size="38" fill="#bcd3f5">
    <text x="0" y="40">The AI drafts the comment.</text>
    <text x="0" y="105">You edit if needed.</text>
    <text x="0" y="170">Send. Developer notified. Done.</text>
  </g>

  <!-- phone comment -->
  <g transform="translate(1240,120)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="840" rx="60" fill="#0a1730"/>
    <rect x="16" y="16" width="448" height="808" rx="46" fill="url(#screen)"/>
    <g transform="translate(44,70)"><text x="0" y="30" fill="#0b1e3f" font-size="26" font-weight="700">Add a comment</text></g>
    <g transform="translate(40,130)" filter="url(#soft)"><rect width="400" height="330" rx="18" fill="#fff"/><text x="24" y="46" fill="#4aa3ff" font-size="20" font-weight="700">AI DRAFT</text><text x="24" y="94" fill="#3a4a63" font-size="22">Please add a unit test for the</text><text x="24" y="126" fill="#3a4a63" font-size="22">new credit-hold path in</text><text x="24" y="158" fill="#3a4a63" font-size="22">SalesTableType, and rebase</text><text x="24" y="190" fill="#3a4a63" font-size="22">onto main (12 commits behind)</text><text x="24" y="222" fill="#3a4a63" font-size="22">before this can be approved.</text><rect x="24" y="258" width="150" height="34" rx="17" fill="#eef2f8"/><text x="99" y="281" text-anchor="middle" fill="#2a4a7f" font-size="18" font-weight="600">Edit draft</text></g>
    <g transform="translate(40,500)"><rect width="400" height="70" rx="35" fill="#4aa3ff"/><text x="200" y="46" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Send to developer</text></g>
    <g transform="translate(40,600)" font-size="20"><circle cx="18" cy="18" r="8" fill="#1faa59"/><text x="40" y="26" fill="#5b6b85">Comment sent · developer notified</text></g>
  </g>
</svg>
