<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1408"/><stop offset="0.6" stop-color="#5c1e0c"/><stop offset="1" stop-color="#7a2a12"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f9ff"/><stop offset="1" stop-color="#e9f0fb"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0b1e3f" flood-opacity="0.14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="160" y="200" fill="#ffb59d" font-size="34" font-weight="600" letter-spacing="3">HIGH RISK · REQUEST CHANGES</text>
  <text x="160" y="320" fill="#ffffff" font-size="66" font-weight="700">This one needs</text>
  <text x="160" y="400" fill="#ffffff" font-size="66" font-weight="700">a closer look.</text>
  <g transform="translate(160,490)" font-size="38" fill="#f3d0c4">
    <text x="0" y="40">!  Touches posting logic in SalesTableType</text>
    <text x="0" y="105">!  No unit test added</text>
    <text x="0" y="170">!  12 commits behind — needs rebase</text>
  </g>
  <text x="160" y="800" fill="#ffb59d" font-size="42" font-weight="700">The clean diff shows only what matters.</text>

  <!-- phone diff -->
  <g transform="translate(1240,120)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="840" rx="60" fill="#0a1730"/>
    <rect x="16" y="16" width="448" height="808" rx="46" fill="url(#screen)"/>
    <g transform="translate(44,70)"><text x="0" y="30" fill="#0b1e3f" font-size="26" font-weight="700">Clean diff</text><text x="0" y="60" fill="#5b6b85" font-size="20">SalesTableType.xpp · noise hidden</text></g>
    <g transform="translate(40,150)" font-family="Consolas, monospace" font-size="19">
      <rect width="400" height="470" rx="16" fill="#0e1b33"/>
      <text x="20" y="46" fill="#6f86ad">  // credit hold check</text>
      <rect x="8" y="60" width="384" height="30" rx="4" fill="#3a1414"/><text x="20" y="82" fill="#ff8080">- if (custTable.CreditMax > 0)</text>
      <rect x="8" y="96" width="384" height="30" rx="4" fill="#12331f"/><text x="20" y="118" fill="#7ee29a">+ if (this.checkCreditHold())</text>
      <rect x="8" y="132" width="384" height="30" rx="4" fill="#12331f"/><text x="20" y="154" fill="#7ee29a">+ {  postingEngine.hold();</text>
      <rect x="8" y="168" width="384" height="30" rx="4" fill="#12331f"/><text x="20" y="190" fill="#7ee29a">+ }</text>
      <text x="20" y="240" fill="#6f86ad">  // ...</text>
      <text x="20" y="300" fill="#f0c674">  ⚠ no test covering this path</text>
    </g>
    <g transform="translate(40,650)"><rect width="400" height="70" rx="35" fill="#d64545"/><text x="200" y="46" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Request changes</text></g>
  </g>
</svg>
