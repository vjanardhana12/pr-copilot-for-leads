<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2f1e"/><stop offset="0.6" stop-color="#0f4a30"/><stop offset="1" stop-color="#16694a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f9ff"/><stop offset="1" stop-color="#e9f0fb"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0b1e3f" flood-opacity="0.14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="160" y="200" fill="#8effc0" font-size="34" font-weight="600" letter-spacing="3">LOW RISK · SAFE TO APPROVE</text>
  <text x="160" y="320" fill="#ffffff" font-size="66" font-weight="700">The AI already read</text>
  <text x="160" y="400" fill="#ffffff" font-size="66" font-weight="700">the diff for you.</text>
  <g transform="translate(160,490)" font-size="38" fill="#c9f3d9">
    <text x="0" y="40">✓  3 files · label + comment fix</text>
    <text x="0" y="105">✓  No logic change</text>
    <text x="0" y="170">✓  Build green · labels correct · no rebase</text>
  </g>
  <text x="160" y="800" fill="#8effc0" font-size="44" font-weight="700">→  One tap: Approve.</text>

  <!-- phone detail -->
  <g transform="translate(1240,120)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="840" rx="60" fill="#0a1730"/>
    <rect x="16" y="16" width="448" height="808" rx="46" fill="url(#screen)"/>
    <g transform="translate(44,70)"><text x="0" y="30" fill="#0b1e3f" font-size="26" font-weight="700">Fix label + comment</text><rect x="0" y="46" width="90" height="30" rx="15" fill="#e5f5ec"/><text x="45" y="67" text-anchor="middle" fill="#1faa59" font-size="18" font-weight="600">LOW</text></g>
    <g transform="translate(40,180)" filter="url(#soft)"><rect width="400" height="230" rx="18" fill="#fff"/><text x="24" y="44" fill="#1faa59" font-size="20" font-weight="700">AI SUMMARY</text><text x="24" y="88" fill="#3a4a63" font-size="21">Renames a label and adds a</text><text x="24" y="118" fill="#3a4a63" font-size="21">clarifying code comment. No</text><text x="24" y="148" fill="#3a4a63" font-size="21">behavioural change. Safe to</text><text x="24" y="178" fill="#3a4a63" font-size="21">approve.</text></g>
    <g transform="translate(40,440)" font-size="20"><rect width="400" height="180" rx="18" fill="#fff" filter="url(#soft)"/><text x="24" y="44" fill="#5b6b85" font-weight="700">PRECHECKS</text><circle cx="34" cy="82" r="8" fill="#1faa59"/><text x="54" y="90" fill="#3a4a63">Build passed</text><circle cx="34" cy="120" r="8" fill="#1faa59"/><text x="54" y="128" fill="#3a4a63">Labels correct</text><circle cx="34" cy="158" r="8" fill="#1faa59"/><text x="54" y="166" fill="#3a4a63">No rebase needed</text></g>
    <g transform="translate(40,660)"><rect width="400" height="70" rx="35" fill="#1faa59"/><text x="200" y="46" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">✓  Approve</text></g>
  </g>
</svg>
