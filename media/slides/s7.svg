<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1e3f"/><stop offset="0.55" stop-color="#123a6b"/><stop offset="1" stop-color="#1e5aa8"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="150" text-anchor="middle" fill="#8fd3ff" font-size="34" font-weight="600" letter-spacing="3">HOW IT WORKS</text>
  <!-- three columns -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- app -->
    <g transform="translate(180,280)">
      <rect width="440" height="500" rx="28" fill="#ffffff" opacity="0.08"/>
      <text x="220" y="90" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="700">Mobile App</text>
      <text x="220" y="150" text-anchor="middle" fill="#bcd3f5" font-size="26">Installable PWA</text>
      <text x="220" y="230" text-anchor="middle" fill="#cfe0f7" font-size="26">Inbox · Risk badges</text>
      <text x="220" y="280" text-anchor="middle" fill="#cfe0f7" font-size="26">Clean diff</text>
      <text x="220" y="330" text-anchor="middle" fill="#cfe0f7" font-size="26">One-tap actions</text>
      <text x="220" y="430" text-anchor="middle" fill="#8fb0e0" font-size="22">Touch-first UI</text>
    </g>
    <!-- backend -->
    <g transform="translate(740,280)">
      <rect width="440" height="500" rx="28" fill="#ffffff" opacity="0.08"/>
      <text x="220" y="90" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="700">Backend</text>
      <text x="220" y="150" text-anchor="middle" fill="#bcd3f5" font-size="26">Azure Function / API</text>
      <text x="220" y="230" text-anchor="middle" fill="#cfe0f7" font-size="26">Calls ADO REST API</text>
      <text x="220" y="280" text-anchor="middle" fill="#cfe0f7" font-size="26">Calls Azure OpenAI</text>
      <text x="220" y="330" text-anchor="middle" fill="#cfe0f7" font-size="26">Holds token securely</text>
      <text x="220" y="430" text-anchor="middle" fill="#8fb0e0" font-size="22">No secrets on the phone</text>
    </g>
    <!-- cloud -->
    <g transform="translate(1300,280)">
      <rect width="440" height="500" rx="28" fill="#ffffff" opacity="0.08"/>
      <text x="220" y="90" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="700">AI + ADO</text>
      <text x="220" y="150" text-anchor="middle" fill="#bcd3f5" font-size="26">Azure OpenAI</text>
      <text x="220" y="230" text-anchor="middle" fill="#cfe0f7" font-size="26">Diff summary</text>
      <text x="220" y="280" text-anchor="middle" fill="#cfe0f7" font-size="26">Risk scoring</text>
      <text x="220" y="330" text-anchor="middle" fill="#cfe0f7" font-size="26">Comment drafting</text>
      <text x="220" y="430" text-anchor="middle" fill="#8fb0e0" font-size="22">PRs · diffs · policies</text>
    </g>
  </g>
  <text x="640" y="545" text-anchor="middle" fill="#4aa3ff" font-size="60">→</text>
  <text x="1200" y="545" text-anchor="middle" fill="#4aa3ff" font-size="60">→</text>
  <text x="960" y="880" text-anchor="middle" fill="#8fb0e0" font-size="28">Responsible AI: the AI recommends — the lead always makes the final call.</text>
</svg>
